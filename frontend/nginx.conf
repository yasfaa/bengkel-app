# ==============================================================================
# Nginx Configuration - BengkelKu Frontend
# Reverse Proxy untuk Backend API
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # ──────────────────────────────────────────────────────────────────────────
    # Gzip Compression (mempercepat load aset statis)
    # ──────────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ──────────────────────────────────────────────────────────────────────────
    # Serve Static Files Vue SPA
    # try_files memastikan Vue Router tidak 404 saat halaman di-refresh
    # ──────────────────────────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache buster untuk file non-hashed
        location ~* \.(html)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Cache agresif untuk aset dengan hash (JS, CSS, Images)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ──────────────────────────────────────────────────────────────────────────
    # Reverse Proxy → Backend API
    # Semua request /api/* diteruskan ke container backend
    # ──────────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Pass real client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # Swagger API Docs (diteruskan ke backend)
    # ──────────────────────────────────────────────────────────────────────────
    location /api-docs {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs.json {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # Security Headers
    # ──────────────────────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ──────────────────────────────────────────────────────────────────────────
    # Error Pages
    # ──────────────────────────────────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
