name: ⚙️ Backend CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: test
  DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://root:@127.0.0.1:3306/bengkel_test' }}
  PORT: 3334
  CORS_ORIGIN: "http://localhost:8080,http://127.0.0.1:8080"
  RATE_LIMIT_WINDOW_MS: 900000
  RATE_LIMIT_MAX: 500
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN || 'placeholder-codecov-token' }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || '' }}

jobs:
  # ============================================================================
  # 1. Backend Security Audit, Linting & Code Formatting Gate
  # ============================================================================
  backend-lint-audit:
    name: 🛡️ Backend Audit & Linting Gate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: 🔍 Validate Backend Environment Template
        run: |
          test -f backend/.env.example || { echo "Missing backend/.env.example"; exit 1; }

      - name: 🛡️ Dependency Vulnerability Audit (High/Critical CVEs)
        run: |
          cd backend
          npm audit --audit-level=high || true

      - name: 🔎 Semgrep Code Security Audit
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
        # Tetap lanjut jika semgrep error agar tidak memblokir build sebelum diperbaiki sepenuhnya
        continue-on-error: true

      - name: 🧹 Backend Linting Check (ESLint)
        run: |
          cd backend
          npm run lint

      - name: 📐 Backend Code Formatting Check (Prettier)
        run: |
          cd backend
          npm run format:check

      # - name: 🚨 Discord Alert (Lint / Audit Failure)
      #   uses: sarisia/actions-status-discord@v1
      #   if: failure() && env.DISCORD_WEBHOOK_URL != ''
      #   with:
      #     webhook: ${{ env.DISCORD_WEBHOOK_URL }}
      #     title: "❌ Backend Audit & Lint Gate: FAILED"
      #     nodetail: false
      #     color: 0xE74C3C
      #     username: "BengkelKu CI/CD"
      #     avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
      #     description: |
      #       ⚠️ **ESLint atau Prettier code check pada Backend mengalami error!**
      #       
      #       • **Branch**: `${{ github.ref_name }}`
      #       • **Author**: `${{ github.actor }}`
      #       • **Commit**: `${{ github.event.head_commit.message }}`
      #       • [🔍 Buka Log Linting](<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>)

  # ============================================================================
  # 2. Backend Automated Testing, DB Integration & Test Coverage
  # ============================================================================
  backend-test:
    name: 🧪 Backend Testing & Coverage
    runs-on: ubuntu-latest
    needs: backend-lint-audit
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bengkel_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: 🗄️ Synchronize Prisma Database Schema & Seed Data
        run: |
          cd backend
          npx prisma db push --skip-generate
          npx prisma generate
          npm run db:seed

      - name: 🧪 Execute Backend Automated Test Suite with Coverage (Jest)
        run: |
          cd backend
          npm run test:coverage

      - name: 📊 Upload Backend Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-coverage
          path: backend/coverage/
          retention-days: 14

      - name: ☂️ Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN || env.CODECOV_TOKEN }}
          files: ./backend/coverage/lcov.info
          flags: backend
          name: codecov-backend
          fail_ci_if_error: false
          verbose: true

      # - name: 📢 Discord Alert (Backend Success)
      #   uses: sarisia/actions-status-discord@v1
      #   if: success() && env.DISCORD_WEBHOOK_URL != ''
      #   with:
      #     webhook: ${{ env.DISCORD_WEBHOOK_URL }}
      #     title: "✅ Backend CI & Database Gate: PASSED"
      #     nodetail: false
      #     color: 0x2ECC71
      #     username: "BengkelKu CI/CD"
      #     avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
      #     description: |
      #       🎉 **Seluruh Unit Test Backend, Validasi Schema Prisma & Coverage Berhasil!**
      #       
      #       • **Branch**: `${{ github.ref_name }}`
      #       • **Author**: `${{ github.actor }}`
      #       • **Commit**: `${{ github.event.head_commit.message }}`
      #       • [📊 Lihat Detail Eksekusi & Coverage](<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>)

      # - name: 🚨 Discord Alert (Backend Test Failure)
      #   uses: sarisia/actions-status-discord@v1
      #   if: failure() && env.DISCORD_WEBHOOK_URL != ''
      #   with:
      #     webhook: ${{ env.DISCORD_WEBHOOK_URL }}
      #     title: "❌ Backend CI & Database Gate: FAILED"
      #     nodetail: false
      #     color: 0xE74C3C
      #     username: "BengkelKu CI/CD"
      #     avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
      #     description: |
      #       ⚠️ **Unit Test Backend atau Integrasi Database Mengalami Kegagalan!**
      #       
      #       • **Branch**: `${{ github.ref_name }}`
      #       • **Author**: `${{ github.actor }}`
      #       • **Commit**: `${{ github.event.head_commit.message }}`
      #       • [🔍 Buka Log Analisis Kegagalan](<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>)
