name: 🚀 Full E2E & Integration Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: e2e-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: test
  DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://root:@127.0.0.1:3306/bengkel_test' }}
  PORT: 3334
  CORS_ORIGIN: "http://localhost:8080,http://127.0.0.1:8080"
  RATE_LIMIT_WINDOW_MS: 900000
  RATE_LIMIT_MAX: 500
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || '' }}

jobs:
  # ============================================================================
  # 1. End-to-End (E2E) Integration & Complete Workshop Lifecycle Test
  # ============================================================================
  e2e-integration-tests:
    name: 🚀 E2E Workshop Lifecycle Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bengkel_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 📦 Install Backend & Frontend Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: 🗄️ Prepare Database Schema & Seed Initial Data
        run: |
          cd backend
          npx prisma db push --skip-generate
          npx prisma generate
          npm run db:seed

      - name: 🌐 Start Backend API Server in Background
        run: |
          cd backend
          node src/index.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: ⏳ Wait for Backend Health Readiness Probe (/api/health)
        run: |
          echo "Waiting for API server to become ready..."
          for i in {1..30}; do
            if curl -s -f http://localhost:3334/api/health > /dev/null; then
              echo "✅ API server is up and healthy!"
              break
            fi
            echo "Waiting for server ($i/30)..."
            sleep 1
          done

      - name: 🧪 Execute End-to-End (E2E) Workflow Test Suite
        run: |
          cd backend
          npm test -- tests/e2e-workflow.test.js

      - name: 📢 Discord Alert (E2E Success)
        uses: sarisia/actions-status-discord@v1
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        with:
          webhook: ${{ env.DISCORD_WEBHOOK_URL }}
          title: "🚀 Full E2E & Workshop Integration: PASSED"
          nodetail: false
          color: 0x9B59B6
          username: "BengkelKu CI/CD"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          description: |
            🎉 **Seluruh Siklus Bisnis Bengkel & Integrasi Database E2E Sukses Terverifikasi!**
            
            • **Branch**: `${{ github.ref_name }}`
            • **Author**: `${{ github.actor }}`
            • **Commit**: `${{ github.event.head_commit.message }}`
            • [📊 Lihat Detail Eksekusi](<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>)

      - name: 🚨 Discord Alert (E2E Failure)
        uses: sarisia/actions-status-discord@v1
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        with:
          webhook: ${{ env.DISCORD_WEBHOOK_URL }}
          title: "❌ Full E2E & Workshop Integration: FAILED"
          nodetail: false
          color: 0xE74C3C
          username: "BengkelKu CI/CD"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          description: |
            ⚠️ **Siklus E2E Integrasi Bengkel Mengalami Kegagalan!**
            
            • **Branch**: `${{ github.ref_name }}`
            • **Author**: `${{ github.actor }}`
            • **Commit**: `${{ github.event.head_commit.message }}`
            • [🔍 Buka Log Analisis Kegagalan](<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>)

